name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test:
    name: Unit tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version input: it reads packageManager from package.json, and passing both
      # is an error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  cloudflare:
    name: Cloudflare stack, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version input: it reads packageManager from package.json, and passing both
      # is an error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Scaffolded under examples/ so the workspace links @flaredev/* to this checkout,
      # which is the point: CI must test the code in the PR, not the last release.
      - name: Scaffold an app
        run: node packages/cli/dist/index.js create examples/ci-cf --yes --skip-install --theme mono

      - name: Install its dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate a resource
        working-directory: examples/ci-cf
        run: |
          node ../../packages/cli/dist/index.js gen resource Contact \
            --fields 'name:string, email:email!, status:enum(lead,customer), avatar:file:[image]:5mb?'

      # A second resource, confined to its owner. Generated before the build because the
      # served bundle is built once — a resource added afterwards would not be in it.
      - name: Generate a resource confined by ownership
        working-directory: examples/ci-cf
        run: |
          node ../../packages/cli/dist/index.js gen resource Invoice --fields 'number:string!, total:money, userId:string'
          node ../../packages/cli/dist/index.js gen policy Invoice --roles '*' --own userId --own-except admin

      # Opt-in, so it has to be generated to be tested. The install follows because the
      # generator adds @better-auth/api-key to package.json.
      # markdown, tags and json: long text with a preview, a free list of labels, and a
      # value whose shape is not declared.
      - name: Generate a resource using the newer field kinds
        working-directory: examples/ci-cf
        run: node ../../packages/cli/dist/index.js gen resource Note --fields 'title:string, body:markdown, labels:tags?, settings:json?'

      - name: Switch on API keys
        working-directory: examples/ci-cf
        run: node ../../packages/cli/dist/index.js gen apikeys

      - name: Install the key plugin
        run: pnpm install --no-frozen-lockfile

      - name: Migrate and seed
        working-directory: examples/ci-cf
        run: |
          node ../../packages/cli/dist/index.js migrate
          node ../../packages/cli/dist/index.js seed:resource Contact 30

      - name: Typecheck the generated app
        working-directory: examples/ci-cf
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build it
        working-directory: examples/ci-cf
        run: node ../../packages/cli/dist/index.js build

      # 127.0.0.1 rather than localhost: with no BETTER_AUTH_URL set, the template's
      # baseURL allowlist covers both, but the checks must use one origin throughout or
      # sign-up is refused as cross-origin.
      - name: Serve it and run the checks
        working-directory: examples/ci-cf
        run: |
          node ../../packages/cli/dist/index.js start --port 8787 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 2
          done
          node ../../scripts/e2e-smoke.mjs http://127.0.0.1:8787 contacts
          node ../../scripts/e2e-ownership.mjs http://127.0.0.1:8787 invoices
          node ../../scripts/e2e-apikeys.mjs http://127.0.0.1:8787 invoices
          node ../../scripts/e2e-field-kinds.mjs http://127.0.0.1:8787 notes

      # No working-directory: the step runs on any failure, including one before the app
      # was scaffolded, and naming a missing directory fails the step instead of the run.
      - name: Server log
        if: failure()
        run: tail -100 examples/ci-cf/server.log 2>/dev/null || echo "no server log"

  next:
    name: Next.js stack, end to end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flare
          POSTGRES_PASSWORD: flare
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flare"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # R2 speaks S3, and so does MinIO — which is how the upload path is tested without
      # a Cloudflare account.
      #
      # bitnamilegacy, pinned: bitnami/minio stopped publishing tags altogether, and both
      # minio/minio on Docker Hub and quay.io now refuse an anonymous pull. This archived
      # tag still works, and it creates the bucket on startup — the official image would
      # need `server /data` as its command, which a service container cannot set.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: flare
          MINIO_ROOT_PASSWORD: flare-secret-123
          MINIO_DEFAULT_BUCKETS: flare-ci
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7
      # No version input: it reads packageManager from package.json, and passing both
      # is an error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Scaffold an app
        run: node packages/cli/dist/index.js create examples/ci-next --stack next --yes --skip-install --theme sky

      - name: Install its dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Point it at the services
        working-directory: examples/ci-next
        run: |
          cat >> .env <<'ENV'
          DATABASE_URL="postgresql://flare:flare@127.0.0.1:5432/ci?sslmode=disable"
          BETTER_AUTH_URL=http://127.0.0.1:3000
          R2_ENDPOINT=http://127.0.0.1:9000
          R2_BUCKET=flare-ci
          R2_ACCESS_KEY_ID=flare
          R2_SECRET_ACCESS_KEY=flare-secret-123
          ENV

      - name: Generate a resource
        working-directory: examples/ci-next
        run: |
          node ../../packages/cli/dist/index.js gen resource Contact \
            --fields 'name:string, email:email!, status:enum(lead,customer), avatar:file:[image]:5mb?'

      # The same two features as the Cloudflare job. Worth running on both: ownership's
      # dashboard counts are a raw parameterised query on this stack, and the apikey table
      # is a Prisma model here rather than a Drizzle one.
      - name: Generate a resource confined by ownership
        working-directory: examples/ci-next
        run: |
          node ../../packages/cli/dist/index.js gen resource Invoice --fields 'number:string!, total:money, userId:string'
          node ../../packages/cli/dist/index.js gen policy Invoice --roles '*' --own userId --own-except admin

      # markdown, tags and json: long text with a preview, a free list of labels, and a
      # value whose shape is not declared.
      - name: Generate a resource using the newer field kinds
        working-directory: examples/ci-next
        run: node ../../packages/cli/dist/index.js gen resource Note --fields 'title:string, body:markdown, labels:tags?, settings:json?'

      - name: Switch on API keys
        working-directory: examples/ci-next
        run: node ../../packages/cli/dist/index.js gen apikeys

      - name: Install the key plugin
        run: pnpm install --no-frozen-lockfile

      - name: Migrate
        working-directory: examples/ci-next
        # Prisma 7 dropped --skip-generate, and its migrate dev does not run the
        # generators either — so lib/generated/prisma has to be asked for. Seed and
        # typecheck both import it, and both run before the build that would make it.
        run: npx prisma migrate dev --name ci && npx prisma generate

      - name: Seed
        working-directory: examples/ci-next
        run: |
          mkdir -p seeds
          cp ../../scripts/ci/contacts.seed.ts seeds/contacts.seed.ts
          node ../../packages/cli/dist/index.js seed

      - name: Typecheck the generated app
        working-directory: examples/ci-next
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build it
        working-directory: examples/ci-next
        run: npx next build

      - name: Serve it and run the checks
        working-directory: examples/ci-next
        run: |
          npx next start --port 3000 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          node ../../scripts/e2e-smoke.mjs http://127.0.0.1:3000 contacts
          node ../../scripts/e2e-ownership.mjs http://127.0.0.1:3000 invoices
          node ../../scripts/e2e-apikeys.mjs http://127.0.0.1:3000 invoices
          node ../../scripts/e2e-field-kinds.mjs http://127.0.0.1:3000 notes

      # The two things HTTP cannot reach: a server action, and a byte in a bucket.
      - name: Export and upload
        working-directory: examples/ci-next
        run: cp ../../scripts/ci/in-app-checks.mts . && npx tsx in-app-checks.mts

      - name: Server log
        if: failure()
        run: |
          tail -100 examples/ci-next/server.log 2>/dev/null || echo "no server log"
          docker logs --tail 50 "$(docker ps -aqf name=minio)" 2>&1 || true
